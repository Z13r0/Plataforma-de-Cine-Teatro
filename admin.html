<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">Panel de Administración</h1>
            <a href="index.html" class="btn btn-outline-light">
                <i class="bi bi-house"></i> Inicio
            </a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-12 col-md-3">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-body">
                        <h5>Usuarios</h5>
                        <h2 id="totalUsuarios" class="text-danger">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-body">
                        <h5>Entradas</h5>
                        <h2 id="totalEntradas" class="text-danger">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-body">
                        <h5>Comentarios</h5>
                        <h2 id="totalComentarios" class="text-danger">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-body">
                        <h5>Contenido agregado</h5>
                        <h2 id="totalContenidoAdmin" class="text-danger">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-black border-secondary mb-5">
            <div class="card-body">
                <h3 class="mb-4">
                    <i class="bi bi-film"></i> Agregar película u obra
                </h3>

                <form id="formContenido">
                    <div class="mb-3">
                        <label for="tipoContenido" class="form-label">Tipo de contenido</label>
                        <select id="tipoContenido" class="form-select" required>
                            <option value="cine">Película</option>
                            <option value="teatro">Obra de teatro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="tituloContenido" class="form-label">Título</label>
                        <input type="text" id="tituloContenido" class="form-control" placeholder="Ej: Interestelar" required>
                    </div>

                    <div class="mb-3">
                        <label for="generoContenido" class="form-label">Género</label>
                        <input type="text" id="generoContenido" class="form-control" placeholder="Ej: Ciencia ficción" required>
                    </div>

                    <div class="mb-3">
                        <label for="duracionContenido" class="form-label">Duración</label>
                        <input type="text" id="duracionContenido" class="form-control" placeholder="Ej: 2 horas y 49 min" required>
                    </div>

                    <div class="mb-3">
                        <label for="clasificacionContenido" class="form-label">Clasificación</label>
                        <select id="clasificacionContenido" class="form-select" required>
                            <option value="TE">TE</option>
                            <option value="+7">+7</option>
                            <option value="+14">+14</option>
                            <option value="+18">+18</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="directorContenido" class="form-label">Director</label>
                        <input type="text" id="directorContenido" class="form-control" placeholder="Nombre del director" required>
                    </div>

                    <div class="mb-3">
                        <label for="repartoContenido" class="form-label">Reparto</label>
                        <input type="text" id="repartoContenido" class="form-control" placeholder="Actor 1, Actor 2, Actor 3..." required>
                    </div>

                    <div class="mb-3">
                        <label for="valoracionContenido" class="form-label">Valoración</label>
                        <input type="number" id="valoracionContenido" class="form-control" min="0" max="5" step="0.1" value="0" placeholder="0 a 5">
                    </div>

                    <div class="mb-3">
                        <label for="imagenContenido" class="form-label">URL de imagen</label>
                        <input type="url" id="imagenContenido" class="form-control" placeholder="https://ejemplo.com/imagen.jpg" required>
                    </div>

                    <div class="mb-3">
                        <label for="sinopsisContenido" class="form-label">Sinopsis</label>
                        <textarea id="sinopsisContenido" class="form-control" rows="4" placeholder="Escribe una breve descripción..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-plus-circle"></i> Agregar contenido
                    </button>
                </form>
            </div>
        </div>

        <div class="card bg-black border-secondary mb-5">
            <div class="card-body">
                <h3 class="mb-4">
                    <i class="bi bi-calendar-plus"></i> Agregar función
                </h3>

                <form id="formFuncion">
                    <div class="mb-3">
                        <label for="contenidoFuncion" class="form-label">Contenido</label>
                        <select id="contenidoFuncion" class="form-select" required>
                            </select>
                    </div>

                    <div class="mb-3">
                        <label for="tipoFuncion" class="form-label">Tipo</label>
                        <select id="tipoFuncion" class="form-select" required>
                            <option value="cine">Película</option>
                            <option value="teatro">Teatro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="fechaFuncion" class="form-label">Fecha</label>
                        <input type="date" id="fechaFuncion" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="horaFuncion" class="form-label">Hora</label>
                        <input type="time" id="horaFuncion" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="salaFuncion" class="form-label">Sala</label>
                        <select id="salaFuncion" class="form-select" required>
                            </select>
                    </div>

                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-calendar-plus"></i> Agregar función
                    </button>
                </form>
            </div>
        </div>

        <section class="mb-5">
            <h3 class="mb-3">
                <i class="bi bi-film"></i> Contenido administrado
            </h3>
            <div id="listaContenidoAdmin" class="row g-4"></div>
        </section>

        <section class="mb-5">
            <h3 class="mb-3">
                <i class="bi bi-calendar-event"></i> Funciones administradas
            </h3>
            <div id="listaFuncionesAdmin"></div>
        </section>

        <section class="mb-5">
            <h3 class="mb-3">Compras recientes</h3>
            <div id="listaCompras"></div>
        </section>

    </main>

    <script src="js/admin.js"></script>
</body>

</html>
