<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <i class="bi bi-film fs-3"></i><span>Cine & Teatro</span>
        </a>
        <span class="badge bg-danger ms-2">Admin</span>
        <div class="ms-auto d-flex align-items-center gap-2" id="authArea"></div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <h1 class="h2 fw-bold section-title mb-0">Panel de administración</h1>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-house"></i> Sitio</a>
    </div>

    <ul class="nav nav-pills mb-4 gap-2" id="adminTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabContenido" type="button">Contenido</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabFunciones" type="button">Funciones</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabCompras" type="button">Compras</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- TAB CONTENIDO -->
      <div class="tab-pane fade show active" id="tabContenido">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card border-custom bg-card p-4">
              <h5 class="fw-bold mb-3" id="formTitulo">Agregar película / obra</h5>
              <form id="formContenido">
                <input type="hidden" id="editId" value="">
                <div class="mb-3">
                  <label class="form-label">Tipo</label>
                  <select id="tipo" class="form-select" required>
                    <option value="cine">Película</option>
                    <option value="teatro">Obra de teatro</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Título</label>
                  <input type="text" id="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Género (separar con coma)</label>
                  <input type="text" id="genero" class="form-control" placeholder="Acción, Drama" required>
                </div>
                <div class="row g-2">
                  <div class="col-6 mb-3">
                    <label class="form-label">Año</label>
                    <input type="number" id="anio" class="form-control" min="1900" max="2030">
                  </div>
                  <div class="col-6 mb-3">
                    <label class="form-label">Duración</label>
                    <input type="text" id="duracion" class="form-control" placeholder="2h 10m">
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Clasificación</label>
                  <select id="clasificacion" class="form-select">
                    <option value="TE">TE</option>
                    <option value="TE+7">TE+7</option>
                    <option value="+14">+14</option>
                    <option value="+18">+18</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Formatos (coma)</label>
                  <input type="text" id="formatos" class="form-control" placeholder="2D, IMAX">
                </div>
                <div class="mb-3">
                  <label class="form-label">Director</label>
                  <input type="text" id="director" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label">Reparto</label>
                  <input type="text" id="reparto" class="form-control">
                </div>
                <div class="mb-3">
                  <label class="form-label">URL imagen</label>
                  <input type="url" id="imagen" class="form-control" placeholder="https://...">
                </div>
                <div class="mb-3">
                  <label class="form-label">Sinopsis</label>
                  <textarea id="sinopsis" class="form-control" rows="3"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Estado</label>
                  <select id="estado" class="form-select">
                    <option value="cartelera">Cartelera</option>
                    <option value="proximo">Próximo estreno</option>
                  </select>
                </div>
                <div class="mb-3" id="boxFechaEstreno">
                  <label class="form-label">Fecha estreno (si es próximo)</label>
                  <input type="text" id="fechaEstreno" class="form-control" placeholder="15/11/2025">
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <button type="submit" class="btn btn-danger" id="btnGuardar">Guardar</button>
                  <button type="button" class="btn btn-outline-light d-none" id="btnCancelar">Cancelar edición</button>
                </div>
              </form>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="d-flex gap-2 mb-3">
              <button type="button" class="btn btn-sm btn-outline-light active" id="filtroTodos">Todos</button>
              <button type="button" class="btn btn-sm btn-outline-light" id="filtroCine">Cine</button>
              <button type="button" class="btn btn-sm btn-outline-light" id="filtroTeatro">Teatro</button>
            </div>
            <div id="listaContenido" class="d-flex flex-column gap-2"></div>
          </div>
        </div>
      </div>

      <!-- TAB FUNCIONES -->
      <div class="tab-pane fade" id="tabFunciones">
        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card border-custom bg-card p-4">
              <h5 class="fw-bold mb-3">Nueva función</h5>
              <form id="formFuncion">
                <div class="mb-3">
                  <label class="form-label">Contenido</label>
                  <select id="funContenido" class="form-select" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Sala</label>
                  <select id="funSala" class="form-select" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Fecha</label>
                  <input type="date" id="funFecha" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Hora</label>
                  <input type="time" id="funHora" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Agregar función</button>
              </form>
            </div>
          </div>
          <div class="col-lg-8">
            <div id="listaFunciones"></div>
          </div>
        </div>
      </div>

      <!-- TAB COMPRAS -->
      <div class="tab-pane fade" id="tabCompras">
        <div id="listaCompras"></div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro · Admin</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    window.addEventListener("scroll", () => {
      document.getElementById("mainNavbar")?.classList.toggle("is-scrolled", window.scrollY > 10);
    });
  </script>
</body>
</html>
