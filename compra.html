<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cine & Teatro - Finalizar Compra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-white">

    <main class="container my-5">
        <h1 class="fw-bold mb-4">Finalizar Compra</h1>

        <div class="row g-4">

            <!-- Formulario de Datos y Pago -->
            <div class="col-12 col-lg-7">
                <form id="formCompra" class="bg-black p-4 rounded border border-secondary shadow">
                    <h4 class="mb-3 text-danger fw-bold">Datos del Comprador</h4>
                    <div class="mb-3">
                        <label for="nombreCliente" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="nombreCliente" required>
                    </div>
                    <div class="mb-3">
                        <label for="emailCliente" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control bg-dark text-white border-secondary" id="emailCliente" required>
                    </div>

                    <h4 class="mb-3 mt-4 text-danger fw-bold">Método de Pago</h4>
                    <div class="mb-3">
                        <label for="numeroTarjeta" class="form-label">Número de Tarjeta</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" id="numeroTarjeta" placeholder="1234 5678 9012 3456" required>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label for="expiracion" class="form-label">Vencimiento</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="expiracion" placeholder="MM/AA" required>
                        </div>
                        <div class="col-6">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary" id="cvv" maxlength="4" placeholder="123" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">Confirmar Pago</button>
                </form>
            </div>

            <!-- Resumen del Pedido -->
            <div class="col-12 col-lg-5">
                <div class="bg-black p-4 rounded border border-secondary shadow">
                    <h4 class="mb-3 text-light fw-bold border-bottom border-secondary pb-2">Resumen de la Reserva</h4>
                    <p class="mb-2"><strong class="text-secondary">Título:</strong> <span id="resumenTitulo">-</span></p>
                    <p class="mb-2"><strong class="text-secondary">Horario:</strong> <span id="resumenHora">-</span></p>
                    <p class="mb-2"><strong class="text-secondary">Butacas:</strong> <span id="resumenAsientos" class="badge bg-danger fs-6">-</span></p>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fs-5">Total a Pagar:</span>
                        <span class="fs-3 fw-bold text-success">$<span id="resumenTotal">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/datos.js"></script>
    <script src="js/compra.js"></script>
</body>
</html>
