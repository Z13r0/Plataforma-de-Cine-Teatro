<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Cine & Teatro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i>
                    <span>Cine & Teatro</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="peliculas.html">Películas</a></li>
                        <li class="nav-item"><a class="nav-link" href="obras.html">Teatro</a></li>
                        <li class="nav-item"><a class="nav-link" href="comunidad.html">Comunidad</a></li>
                        <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                    </ul>
                    <div id="authArea" class="d-flex align-items-center gap-2"></div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="mb-4">
            <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver a butacas
            </button>
        </div>

        <h1 class="fw-bold mb-4 section-title">Finalizar Compra</h1>

        <div class="row g-4">
            <div class="col-12 col-lg-7">
                <form id="formCompra" class="p-4 rounded border border-custom bg-card shadow">
                    <h4 class="mb-3 text-danger fw-bold">Datos del Comprador</h4>
                    <div class="mb-3">
                        <label for="nombreCliente" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombreCliente" required>
                    </div>
                    <div class="mb-3">
                        <label for="emailCliente" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="emailCliente" required>
                    </div>

                    <h4 class="mb-3 mt-4 text-danger fw-bold">Método de Pago</h4>
                    <div class="mb-3">
                        <label for="numeroTarjeta" class="form-label">Número de Tarjeta</label>
                        <input type="text" class="form-control" id="numeroTarjeta" placeholder="1234 5678 9012 3456" required>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label for="expiracion" class="form-label">Vencimiento</label>
                            <input type="text" class="form-control" id="expiracion" placeholder="MM/AA" required>
                        </div>
                        <div class="col-6">
                            <label for="cvv" class="form-label">CVV</label>
                            <input type="password" class="form-control" id="cvv" maxlength="4" placeholder="123" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">Confirmar Pago</button>
                </form>
            </div>

            <div class="col-12 col-lg-5">
                <div class="p-4 rounded border border-custom bg-card shadow">
                    <h4 class="mb-3 fw-bold border-bottom border-custom pb-2">Resumen de la Reserva</h4>
                    <p class="mb-2"><strong class="text-secondary">Título:</strong> <span id="resumenTitulo">-</span></p>
                    <p class="mb-2"><strong class="text-secondary">Horario:</strong> <span id="resumenHora">-</span></p>
                    <p class="mb-2"><strong class="text-secondary">Butacas:</strong> <span id="resumenAsientos" class="badge bg-danger fs-6">-</span></p>
                    <hr class="border-custom">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fs-5">Total a Pagar:</span>
                        <span class="fs-3 fw-bold text-success">$<span id="resumenTotal">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 Cine & Teatro · Prototipo académico</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/compra.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
