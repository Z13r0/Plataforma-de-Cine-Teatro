<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Cine & Teatro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i>
                    <span>Cine & Teatro</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="peliculas.html">Películas</a></li>
                        <li class="nav-item"><a class="nav-link" href="obras.html">Teatro</a></li>
                        <li class="nav-item"><a class="nav-link" href="comunidad.html">Comunidad</a></li>
                        <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                    </ul>

                    <div id="authArea" class="d-flex align-items-center gap-2">
                        <!-- Se llena con app.js -->
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <div class="mb-4">
            <h1 class="fw-bold">
                <i class="bi bi-person-circle text-danger"></i> Mi Perfil
            </h1>
            <p class="text-secondary">Información de tu cuenta y actividad</p>
        </div>

        <div class="row g-4">

            <!-- Datos del usuario -->
            <div class="col-12 col-lg-4">
                <div class="card bg-black border-secondary h-100">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="bi bi-person-circle display-1 text-danger"></i>
                        </div>
                        <h3 id="nombrePerfil" class="fw-bold mb-1">-</h3>
                        <p id="emailPerfil" class="text-secondary mb-3">-</p>
                        <span id="rolPerfil" class="badge bg-secondary">Cliente</span>

                        <hr class="border-secondary my-4">

                        <div class="d-grid gap-2">
                            <a href="entradas.html" class="btn btn-outline-light btn-sm">
                                <i class="bi bi-ticket-perforated"></i> Mis Entradas
                            </a>
                            <a href="historial.html" class="btn btn-outline-light btn-sm">
                                <i class="bi bi-clock-history"></i> Historial
                            </a>
                            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actividad -->
            <div class="col-12 col-lg-8">
                <div class="card bg-black border-secondary mb-4">
                    <div class="card-body">
                        <h5 class="card-title mb-3">
                            <i class="bi bi-chat-left-text"></i> Mis Comentarios
                        </h5>
                        <div id="misComentarios">
                            <!-- Se llena con JavaScript -->
                        </div>
                    </div>
                </div>

                <div class="card bg-black border-secondary">
                    <div class="card-body">
                        <h5 class="card-title mb-3">
                            <i class="bi bi-ticket-perforated"></i> Últimas Entradas
                        </h5>
                        <div id="misEntradas">
                            <!-- Se llena con JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-black text-secondary py-4 border-top border-secondary mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo de Web Interactivo</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
    <script src="js/perfil.js"></script>

</body>
</html>
