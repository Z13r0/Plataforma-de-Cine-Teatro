<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><i class="bi bi-film fs-3"></i><span>Cine & Teatro</span></a>
        <div id="authArea" class="ms-auto"></div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h2 fw-bold section-title mb-4">Mi perfil</h1>
    <div id="infoPerfil" class="card border-custom bg-card p-4"></div>
  </main>

  <footer class="py-4 mt-auto"><div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const u = JSON.parse(localStorage.getItem("usuarioActual") || "null");
      const el = document.getElementById("infoPerfil");
      if (!u) {
        el.innerHTML = `<p class="mb-3">No has iniciado sesión.</p><a href="login.html" class="btn btn-danger">Iniciar sesión</a>`;
        return;
      }
      el.innerHTML = `
        <p><strong>Nombre:</strong> ${u.nombre}</p>
        <p><strong>Correo:</strong> ${u.email}</p>
        <p class="mb-0"><strong>Rol:</strong> ${u.rol || "usuario"}</p>
        <a href="historial.html" class="btn btn-outline-light mt-3">Ver mis compras</a>
      `;
    });
    window.addEventListener("scroll", () => {
      document.getElementById("mainNavbar")?.classList.toggle("is-scrolled", window.scrollY > 10);
    });
  </script>
</body>
</html>
