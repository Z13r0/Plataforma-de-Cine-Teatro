<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><i class="bi bi-film fs-3"></i><span>Cine & Teatro</span></a>
        <div class="ms-auto" id="authArea"></div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-7">
        <h1 class="fw-bold mb-4">Pago</h1>
        <div class="card border-custom bg-card mb-4" id="boxAuth">
          <div class="card-body">
            <h5 class="mb-2">¿Cómo quieres continuar?</h5>
            <p class="text-secondary small mb-3">Inicia sesión, crea cuenta o compra como invitado.</p>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <button type="button" class="btn btn-danger" id="btnInvitado">Comprar como invitado</button>
              <a href="login.html" class="btn btn-outline-light">Iniciar sesión</a>
              <a href="registro.html" class="btn btn-outline-light">Crear cuenta</a>
            </div>
            <div id="formInvitado" class="d-none">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Nombre *</label><input type="text" id="nombreInv" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">Correo *</label><input type="email" id="emailInv" class="form-control"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card border-custom bg-card mb-4">
          <div class="card-body">
            <h5 class="mb-3">Método de pago</h5>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pago" id="webpay" value="webpay" checked><label class="form-check-label" for="webpay">Webpay</label></div>
            <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pago" id="khipu" value="khipu"><label class="form-check-label" for="khipu">Khipu</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="pago" id="simulado" value="simulado"><label class="form-check-label" for="simulado">Pago simulado</label></div>
          </div>
        </div>
        <div class="card border-custom bg-card mb-4">
          <div class="card-body">
            <h5 class="mb-3">Términos</h5>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="terminos">
              <label class="form-check-label small" for="terminos">Acepto los términos y la política de privacidad.</label>
            </div>
          </div>
        </div>
        <button id="btnPagar" class="btn btn-danger btn-lg w-100 fw-bold">Confirmar y pagar</button>
      </div>
      <div class="col-lg-5">
        <div id="resumenSidebar" class="p-4 rounded border border-custom bg-card sticky-top" style="top:80px"></div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto"><div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pago.js"></script>
</body>
</html>
