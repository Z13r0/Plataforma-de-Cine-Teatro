                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Inicio</a>

        <!-- Contenido Principal -->
        <!-- Archivo: obras.html -->
        <main class="container py-4">

            <!-- Botón para volver a la página anterior -->
            <div class="mb-3">
            <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </button>
            </div>

        <!-- Título -->
        <h1 class="h2 fw-bold mb-4 border-start border-4 border-danger ps-2">
            Cartelera de Teatro
        </h1>

        <!-- Buscador y filtros -->
        <div class="row g-3 mb-4 p-3 bg-secondary bg-opacity-25 rounded">
            <div class="col-12 col-md-6">
                <input type="text" id="inputBuscador" class="form-control bg-dark text-white border-secondary" placeholder="Buscar por título...">
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <select id="selectGenero" class="form-select bg-dark text-white border-secondary">
                    <option value="">Todos los géneros</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Musical">Musical</option>
                    <option value="Tragedia">Tragedia</option>
                    <option value="Clásico">Clásico</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <select id="selectClasificacion" class="form-select bg-dark text-white border-secondary">
                    <option value="">Todas las clasificaciones</option>
                    <option value="TE">TE</option>
                    <option value="TE+7">TE+7</option>
                    <option value="+14">+14</option>
                    <option value="+18">+18</option>
                </select>
            </div>
        </div>

        <!-- Aquí se dibujarán las obras dinámicamente -->
        <div id="contenedorObras" class="d-flex flex-column gap-4">
            <!-- Las tarjetas se generarán con JavaScript -->
        </div>
