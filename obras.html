<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teatro - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
          <i class="bi bi-film fs-3"></i><span>Cine & Teatro</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="peliculas.html">Películas</a></li>
            <li class="nav-item"><a class="nav-link active" href="obras.html">Teatro</a></li>
            <li class="nav-item"><a class="nav-link" href="comunidad.html">Comunidad</a></li>
            <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
          </ul>
          <div id="authArea" class="d-flex align-items-center gap-2"></div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <h1 class="h2 fw-bold section-title mb-0">Cartelera de Teatro</h1>
      <button class="btn btn-outline-light" type="button" data-bs-toggle="collapse" data-bs-target="#panelFiltros">
        <i class="bi bi-funnel"></i> Filtros
      </button>
    </div>

    <div class="collapse mb-4" id="panelFiltros">
      <div class="filtros-panel">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small text-secondary">Nombre</label>
            <input type="text" id="inputBuscador" class="form-control" placeholder="Buscar obra...">
          </div>
          <div class="col-md-3">
            <label class="form-label small text-secondary">Clasificación</label>
            <select id="selectClasificacion" class="form-select">
              <option value="">Todas</option>
              <option value="TE">TE</option>
              <option value="TE+7">TE+7</option>
              <option value="+14">+14</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-secondary">Género</label>
            <select id="selectGenero" class="form-select">
              <option value="">Todos</option>
              <option value="Drama">Drama</option>
              <option value="Musical">Musical</option>
              <option value="Comedia">Comedia</option>
              <option value="Familiar">Familiar</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small text-secondary">Año</label>
            <select id="selectAnio" class="form-select">
              <option value="">Todos</option>
              <option value="1986">1986</option>
              <option value="1980">1980</option>
              <option value="1975">1975</option>
              <option value="1936">1936</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="contenedorObras" class="row g-4"></div>

    <div class="text-center mt-5">
      <a href="peliculas.html" class="btn btn-outline-light me-2">Ver películas</a>
      <button type="button" class="btn btn-danger" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCompraRapida">Compra rápida</button>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro</p></div>
  </footer>

  <button class="btn btn-danger btn-compra-rapida" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCompraRapida">
    <i class="bi bi-lightning-fill"></i> Compra rápida
  </button>
  <div class="offcanvas offcanvas-end offcanvas-compra" tabindex="-1" id="offcanvasCompraRapida">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title fw-bold">Compra rápida</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p class="text-secondary small mb-4">En pocos pasos obtén tu entrada.</p>
      <div class="mb-3"><label class="form-label">Película / Obra *</label><select id="crPelicula" class="form-select"></select></div>
      <div class="mb-3"><label class="form-label">Fecha *</label><select id="crFecha" class="form-select" disabled></select></div>
      <div class="mb-3"><label class="form-label">Formato *</label><select id="crFormato" class="form-select" disabled></select></div>
      <div class="mb-4"><label class="form-label">Hora *</label><select id="crHora" class="form-select" disabled></select></div>
      <button id="crBtnComprar" class="btn btn-danger w-100 fw-bold" disabled>Comprar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
  <script src="js/compra-rapida.js"></script>
  <script src="js/obras.js"></script>
  <script>
    window.addEventListener("scroll", () => {
      document.getElementById("mainNavbar")?.classList.toggle("is-scrolled", window.scrollY > 10);
    });
  </script>
</body>
</html>
