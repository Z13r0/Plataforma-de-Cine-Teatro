<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Cine & Teatro</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i>
                    <span>Cine & Teatro</span>
                </a>

                <!-- Botón menú móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="peliculas.html">Películas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="obras.html">Teatro</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="comunidad.html">Comunidad</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="historial.html">Historial</a>
                        </li>
                    </ul>

                    <!-- ÁREA DE SESIÓN (controlada por app.js) -->
                    <div id="authArea" class="d-flex align-items-center gap-2">
                        <!-- Aquí se cargan los botones automáticamente -->
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow-1 container d-flex align-items-center justify-content-center py-5">
        <div class="card bg-black text-light border-secondary shadow-lg rounded-4 p-4" style="max-width: 480px; width: 100%;">
            <div class="card-body">

                <!-- Encabezado -->
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill fs-1 text-danger"></i>
                    <h2 class="fw-bold mt-2 h3">Crear una Cuenta</h2>
                    <p class="text-secondary small">Únete para reservar tus funciones de cine y teatro preferidas</p>
                </div>

                <!-- Formulario de Registro -->
                <form id="formRegistro">
                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombre" placeholder="Ej. Juan Pérez" required>
                        </div>
                    </div>

                    <!-- Correo Electrónico -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="email" placeholder="nombre@ejemplo.com" required>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" placeholder="Mínimo 8 caracteres" required>
                        </div>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="confirmPassword" placeholder="Repite tu contraseña" required>
                        </div>
                    </div>

                    <!-- Términos -->
                    <div class="form-check mb-4 small">
                        <input type="checkbox" class="form-check-input bg-dark border-secondary" id="terms" required>
                        <label class="form-check-label text-secondary" for="terms">
                            Acepto los <a href="#" class="text-danger text-decoration-none">Términos y Condiciones</a> y la <a href="#" class="text-danger text-decoration-none">Política de Privacidad</a>
                        </label>
                    </div>

                    <!-- Botón -->
                    <button type="submit" class="btn btn-danger w-100 fw-semibold py-2">
                        Registrarme
                    </button>
                </form>

                <!-- Pie -->
                <div class="text-center mt-4 pt-3 border-top border-secondary small">
                    <span class="text-secondary">¿Ya tienes una cuenta?</span>
                    <a href="login.html" class="text-danger text-decoration-none fw-semibold ms-1">Inicia Sesión</a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-secondary py-4 border-top border-secondary">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo de Web Interactivo</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
