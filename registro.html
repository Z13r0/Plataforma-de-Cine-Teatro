                    <span>Cine & Teatro</span>   
                </a>

                <!-- Boton de Menu para Moviles-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú de Navegación-->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <!-- Inicio de la pagina -->
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Inicio</a>
                        </li>
                        <!-- Peliculas -->
                        <li class="nav-item">
                            <a class="nav-link" href="peliculas.html">Peliculas</a>
                        </li>
                        <!-- Teatro -->
                        <li class="nav-item">
                            <a class="nav-link" href="obras.html">Teatro</a>
                        </li>
                        <!-- Comunidad -->
                        <li class="nav-item">
                            <a class="nav-link" href="comunidad.html">Comunidad</a>
                        </li>
                        <!-- Historial de Compras -->

                            <a class="nav-link" href="historial.html">Historial</a>

                    <!-- Opciones Inicio de Sesión -->
                    <div class="d-flex align-items-center gap-2">
                        <a href="entradas.html" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                            <i class="bi bi-ticket-perforated"></i> Mis Entradas
                        </a>
                        <a href="login.html" class="btn btn-danger btn-sm">
                            <i class="bi bi-person-fill"></i> Iniciar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </header>

<!-- Contenido Principal Centrado con Flexbox -->
        <main class="flex-grow-1 container d-flex align-items-center justify-content-center py-5">
            <!-- Contenedor de Registro (Tarjeta con sombra y relieve) -->
            <div class="card bg-black text-light border-secondary shadow-lg rounded-4 p-4" style="max-width: 480px; width: 100%;">
                <div class="card-body">
                    
                    <!-- Encabezado de la Tarjeta -->
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill fs-1 text-danger"></i>
                        <h2 class="fw-bold mt-2 h3">Crear una Cuenta</h2>
                        <p class="text-secondary small">Únete para reservar tus funciones de cine y teatro preferidas</p>
                    </div>

                    <!-- Formulario de Registro -->
                    <form>
                        <!-- Campo: Nombre Completo -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                        </div>

                        <!-- Campo: Correo Electrónico -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-dark text-light border-secondary" id="email" placeholder="nombre@ejemplo.com" required>
                            </div>
                        </div>

                        <!-- Campo: Contraseña -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" placeholder="Mínimo 8 caracteres" required>
                            </div>
                        </div>

                        <!-- Campo: Confirmar Contraseña -->
                        <div class="mb-3">
                            <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="confirm-password" placeholder="Repite tu contraseña" required>
                            </div>
                        </div>

                        <!-- Aceptación de Términos -->
                        <div class="form-check mb-4 small">
                            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="terms" required>
                            <label class="form-check-label text-secondary" for="terms">
                                Acepto los <a href="#" class="text-danger text-decoration-none">Términos y Condiciones</a> y la <a href="#" class="text-danger text-decoration-none">Política de Privacidad</a>
                            </label>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn btn-danger w-100 fw-semibold py-2">
                            Registrarme
                        </button>
                    </form>

                    <!-- Pie de la Tarjeta (Link a Login) -->
                    <div class="text-center mt-4 pt-3 border-top border-secondary small">
                        <span class="text-secondary">¿Ya tienes una cuenta?</span> 
                        <a href="login.html" class="text-danger text-decoration-none fw-semibold ms-1">Inicia Sesión</a>
                    </div>

                </div>
            </div>
        </main>

        <footer class="bg-black text-secondary py-4 border-top border-secondary">
            <div class="container text-center">
                <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo de Web Interactivo</p>
            </div>
