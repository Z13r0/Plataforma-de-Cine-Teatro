<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><i class="bi bi-film fs-3"></i><span>Cine & Teatro</span></a>
        <div id="authArea" class="ms-auto"></div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-custom bg-card p-4">
          <h1 class="h3 fw-bold mb-4 text-center">Crear cuenta</h1>
          <form id="formRegistro">
            <div class="mb-3"><label class="form-label">Nombre</label><input type="text" id="nombre" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Correo</label><input type="email" id="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" id="password" class="form-control" required minlength="6"></div>
            <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terminosRegistro" required>
            <label class="form-check-label small" for="terminosRegistro">
                Acepto los <a href="#" class="text-danger">Términos y Condiciones</a> y la Política de Privacidad.
            </label>
            </div>
            
            <button type="submit" class="btn btn-danger w-100 fw-bold">Registrarme</button>
          </form>
          <p class="text-center small text-secondary mt-3 mb-0">
            ¿Ya tienes cuenta? <a href="login.html" class="text-danger">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto"><div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/app.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
