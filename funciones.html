<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta charset="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Cine & Teatro - Cartelera y Horarios</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body class="bg-dark text-white">
        
        <main class="container my-5">
            
            <!-- Botón para volver a la página anterior -->
            <div class="mb-3">
            <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </button>
            </div>

            <h1 class="mb-4 fw-bold">Cartelera & Horarios</h1>
        
            <!-- Selector de Fechas -->
            <div class="row g-2 mb-4 text-center" id="contenedorFechas">
                <div class="col"><button class="btn btn-danger w-100 py-2 btn-fecha active" data-fecha="Hoy">Hoy</button></div>
                <div class="col"><button class="btn btn-outline-secondary text-light w-100 py-2 btn-fecha" data-fecha="Mañana">Mañana</button></div>
                <div class="col"><button class="btn btn-outline-secondary text-light w-100 py-2 btn-fecha" data-fecha="Fin de semana">Fin de semana</button></div>
            </div>

            <!-- Contenedor dinamico de funciones -->
            <div class="d-flex flex-column gap-4" id="contenedorFunciones"></div>
            
        </main>

        <script src="js/datos.js"></script>
        <script src="js/funciones.js"></script>
    </body>
</html>
