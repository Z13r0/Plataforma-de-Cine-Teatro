<html>
    <head>
        <meta charset="UTF-8">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!-- CSS Personalizado -->
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body class="bg-dark text-light d-flex flex-column min-vh-100">
            <!-- Header / Navbar -->
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
                <div class="container">
                    <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                        <i class="bi bi-film fs-3"></i>
                        <span>Cine & Teatro</span>   
                    </a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="peliculas.html">Películas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="obras.html">Teatro</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="comunidad.html">Comunidad</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="historial.html">Historial</a>
                            </li>
                        </ul>

                        <div class="d-flex align-items-center gap-2">
                            <a href="entradas.html" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                                <i class="bi bi-ticket-perforated"></i> Mis Entradas
                            </a>
                            <a href="login.html" class="btn btn-danger btn-sm">
                                <i class="bi bi-person-fill"></i> Iniciar Sesión
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="flex-grow-1 container d-flex align-items-center justify-content-center py-5">
            <!-- Contenedor del Formulario (Tarjeta con sombra y relieve) -->
            <div class="card bg-black text-light border-secondary shadow-lg rounded-4 p-4" style="max-width: 400px; width: 100%;">
                <div class="card-body">
            
                    <!-- Encabezado -->
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle fs-1 text-danger"></i>
                        <h2 class="fw-bold mt-2 h3">Iniciar Sesión</h2>
                        <p class="text-secondary small">Ingresa a tu cuenta para gestionar tus entradas</p>
                    </div>

                    <!-- Formulario -->
                    <form id="formLogin">
                        <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control bg-dark text-light border-secondary" id="email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="password"  required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input bg-dark border-secondary" id="remember">
                                <label class="form-check-label text-secondary" for="remember">Recordarme</label>
                            </div>
                            <a href="#" class="text-danger text-decoration-none">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 fw-semibold py-2" id="ingresar">
                            Ingresar
                        </button>
                    </form>

                    <!-- Pie del Formulario -->
                    <div class="text-center mt-4 pt-3 border-top border-secondary small">
                        <span class="text-secondary">¿No tienes una cuenta?</span> 
                        <a href="registro.html" class="text-danger text-decoration-none fw-semibold ms-1">Regístrate</a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-black text-secondary py-4 border-top border-secondary">
            <div class="container text-center">
                <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo de Web Interactivo</p>
            </div>
        </footer>
        

            <!-- Bootstrap 5.3 JavaScript Bundle (Incluye Popper para modales y dropdowns) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            
            <!-- JavaScript Principal -->
        <script src="js/auth.js"></script>

        <!-- Sesion -->
        <script src="js/app.js"></script>


    </body>
