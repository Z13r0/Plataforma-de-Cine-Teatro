<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Cine & Teatro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><i class="bi bi-film fs-3"></i><span>Cine & Teatro</span></a>
        <div id="authArea" class="ms-auto"></div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card border-custom bg-card p-4">
          <h1 class="h3 fw-bold mb-4 text-center">Iniciar sesión</h1>
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" required>
            </div>
            
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="terminosLogin" required>
              <label class="form-check-label small" for="terminosLogin">
              Acepto los <a href="#" class="text-danger">Términos y Condiciones</a>.
              </label>
            </div>

            <button type="submit" class="btn btn-danger w-100 fw-bold">Entrar</button>
          </form>
          <p class="text-center small text-secondary mt-3 mb-0">
            ¿No tienes cuenta? <a href="registro.html" class="text-danger">Regístrate</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto"><div class="container text-center"><p class="mb-0 small">&copy; 2026 Cine & Teatro</p></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
