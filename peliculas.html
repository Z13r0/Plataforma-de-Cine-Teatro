<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - Cine & Teatro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark text-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
            <div class="container">
                <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i> <span>Cine & Teatro</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="peliculas.html">Películas</a></li>
                        <li class="nav-item"><a class="nav-link" href="obras.html">Teatro</a></li>
                        <li class="nav-item"><a class="nav-link" href="comunidad.html">Comunidad</a></li>
                        <li class="nav-item"><a class="nav-link" href="historial.html">Historial</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-2">
                        <a href="entradas.html" class="btn btn-outline-light btn-sm"><i class="bi bi-ticket-perforated"></i> Mis Entradas</a>
                        <a href="login.html" class="btn btn-danger btn-sm"><i class="bi bi-person-fill"></i> Iniciar Sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <!-- Titulo-->
        <h1 class="h2 fw-bold mb-4 border-start border-4 border-danger ps-2">Catálogo de Películas</h1>
        
        <!-- Buscador y filtros -->
        <div class="row g-3 mb-4 p-3 bg-secondary bg-opacity-25 rounded">

            <!-- Buscador por Texto -->
            <div class="col-12 col-md-6">
                <input type="text" id="inputBuscador" class="form-control bg-dark text-white border-secondary" placeholder="Buscar por Titulo...">
            </div>
            <!-- Buscador por Genero -->
            <div class="col-12 col-sm-6 col-md-3">
                <select id="selectGenero" class="form-select bg-dark text-white border-secondary">
                    <option value="">Todos los géneros</option>
                    <option value="Acción">Acción</option>
                    <option value="Comedia">Comedia</option>
                    <option value="Terror">Terror</option>
                    <option value="Romance">Romance</option>
                    <option value="aventura">Aventura</option>
                    <option value="Suspenso">Suspenso</option>
                </select>
            </div>

            <!-- Filtro de Clasificación -->
            <div class="col-12 col-sm-6 col-md-3">
                <select id="selectClasificacion" class="form-select bg-dark text-white border-secondary">
                    <option value="">Todas las clasificaciones</option>
                    <option value="TE">TE (Todo publico)</option>
                    <option value="TE+7">TE+7</option>
                    <option value="TE+14">+14</option>
                    <option value="+18">+18</option>
                </select>
            </div>
        </div>

        <!-- Contenedor de las Tarjetas (JS dibujara las peliculas)-->

        <div class="row g-4" id="contenedorPeliculas"></div>
    </main>

    <footer class="bg-black text-secondary py-4 border-top border-secondary mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo Web Interactivo</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/peliculas.js"></script>
</body>
</html>
