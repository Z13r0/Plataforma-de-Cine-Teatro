<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad - Cine & Teatro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar completo -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i>
                    <span>Cine & Teatro</span>
                </a>

                <!-- Botón menú móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="peliculas.html">Películas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="obras.html">Teatro</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="comunidad.html">Comunidad</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="historial.html">Historial</a>
                        </li>
                    </ul>

                    <!-- ÁREA DE SESIÓN -->
                    <div id="authArea" class="d-flex align-items-center gap-2">
                        <!-- Se carga automáticamente con app.js -->
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <!-- Botón Volver -->
        <div class="mb-3">
            <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </button>
        </div>

        <h1 class="fw-bold mb-2">Comunidad</h1>
        <p class="text-secondary mb-4">Comparte tu opinión sobre películas y obras de teatro</p>

        <!-- Formulario nuevo comentario -->
        <div class="card bg-black border-secondary mb-5">
            <div class="card-body">
                <h5 class="card-title mb-3">Escribe tu comentario</h5>

                <form id="formComentario">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="nombreUsuario" class="form-control bg-dark text-light border-secondary" placeholder="Tu nombre" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Película / Obra</label>
                            <select id="contenidoSeleccionado" class="form-select bg-dark text-light border-secondary" required>
                                <option value="">Selecciona una opción</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Valoración</label>
                            <select id="valoracion" class="form-select bg-dark text-light border-secondary" required>
                                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                                <option value="4">⭐⭐⭐⭐ (4)</option>
                                <option value="3">⭐⭐⭐ (3)</option>
                                <option value="2">⭐⭐ (2)</option>
                                <option value="1">⭐ (1)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Comentario</label>
                            <textarea id="textoComentario" class="form-control bg-dark text-light border-secondary" rows="3" placeholder="¿Qué te pareció?" required></textarea>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-send"></i> Publicar comentario
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de comentarios -->
        <h4 class="mb-3">Comentarios Recientes</h4>
        <div id="listaComentarios" class="d-flex flex-column gap-3">
            <!-- Los comentarios se generan con JavaScript -->
        </div>

    </main>

    <footer class="bg-black text-secondary py-4 border-top border-secondary mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo Web Interactivo</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/comunidad.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
