<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-cinemark" id="mainNavbar">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html"><i class="bi bi-film fs-3"></i><span>Cine & Teatro</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          </ul>
          <div id="authArea" class="d-flex align-items-center gap-2"></div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <button onclick="history.back()" class="btn btn-outline-light btn-sm mb-3"><i class="bi bi-arrow-left"></i> Volver</button>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="text-center mb-4">
          <h1 class="fw-bold">Selecciona tu butaca</h1>
          <p id="tituloSeleccion" class="fs-4 text-danger mb-1"></p>
          <p id="detallesFuncion" class="text-secondary"></p>
        </div>
        <div class="text-center mb-3">
          <div class="bg-secondary rounded py-2 mx-auto text-dark fw-bold" style="max-width:420px">PANTALLA</div>
        </div>
        <div id="contenedorButacas" class="d-flex flex-column align-items-center gap-1 mb-4"></div>

          <span><span class="btn btn-danger btn-sm me-1" style="pointer-events:none;width:36px">1</span> Seleccionada</span>

        <div class="text-center">
          <p>Butacas: <strong id="cantidadSeleccionadas">0</strong></p>
          <p class="fs-5">Total: <strong class="text-success">$<span id="total">0</span></strong></p>
