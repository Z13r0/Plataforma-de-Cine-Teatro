<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Butacas - Cine & Teatro</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top border-bottom border-secondary">
            <div class="container">

                <!-- Logo -->
                <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2" href="index.html">
                    <i class="bi bi-film fs-3"></i>
                    <span>Cine & Teatro</span>
                </a>

                <!-- Botón menú móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="peliculas.html">Películas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="obras.html">Teatro</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="comunidad.html">Comunidad</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="historial.html">Historial</a>
                        </li>
                    </ul>

                    <!-- ÁREA DE SESIÓN (controlada por app.js) -->
                    <div id="authArea" class="d-flex align-items-center gap-2">
                        <!-- Aquí se cargan los botones automáticamente -->
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container py-5">

        <!-- Botón para volver -->
        <div class="mb-3">
            <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </button>
        </div>

        <!-- Título y detalles de la función -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Selección de Butacas</h1>
            <p id="tituloSeleccion" class="fs-4 text-danger mb-1"></p>
            <p id="detallesFuncion" class="text-secondary"></p>
        </div>

        <!-- Representación de la pantalla del cine -->
        <div class="text-center mb-4">
            <div class="bg-secondary rounded py-2 mx-auto text-dark fw-bold" style="max-width: 480px;">
                PANTALLA
            </div>
        </div>

        <!-- Contenedor de butacas (se genera con JavaScript) -->
        <div id="contenedorButacas" class="d-flex flex-column align-items-center gap-2 mb-4">
            <!-- Las filas se crearán dinámicamente -->
        </div>

        <!-- Leyenda de colores -->
        <div class="d-flex justify-content-center gap-4 mb-4 flex-wrap">
            <div class="d-flex align-items-center gap-2">
                <div class="btn btn-outline-light btn-sm" style="width:40px; pointer-events:none;">1</div>
                <span class="small">Disponible</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="btn btn-danger btn-sm" style="width:40px; pointer-events:none;">1</div>
                <span class="small">Seleccionada</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="btn btn-secondary btn-sm" style="width:40px; pointer-events:none;" disabled>1</div>
                <span class="small">Ocupada</span>
            </div>
        </div>

        <!-- Resumen de selección -->
        <div class="text-center">
            <p class="mb-1">
                Butacas seleccionadas: <strong id="cantidadSeleccionadas">0</strong>
            </p>
            <p class="fs-4 mb-3">
                Total: <strong class="text-success">$<span id="total">0</span></strong>
            </p>

            <button id="btnContinuar" class="btn btn-danger btn-lg px-5">
                Continuar a la compra
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-black text-secondary py-4 border-top border-secondary mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Cine & Teatro - Prototipo de Web Interactivo</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
    <script src="js/butacas.js"></script>

</body>
</html>
