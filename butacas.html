<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Butacas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

  <main class="container py-5">

    <!-- Boton para volver a la pagina anterior-->
    <div class="mb-3">
      <button onclick="window.history.back()" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left"></i> Volver
      </button>
    </div>

    <!-- Título y detalles de la función -->
    <div class="text-center mb-4">
      <h1 class="fw-bold">Selección de Butacas</h1>
      <p id="tituloSeleccion" class="fs-4 text-danger mb-1"></p>
      <p id="detallesFuncion" class="text-secondary"></p>
    </div>

    <!-- Representación de la pantalla del cine -->
    <div class="text-center mb-4">
      <div class="bg-secondary rounded py-2 mx-auto text-dark fw-bold" style="max-width: 480px;">
        PANTALLA
      </div>
    </div>

    <!-- Aquí se generarán las butacas con JavaScript -->
    <div id="contenedorButacas" class="d-flex flex-column align-items-center gap-2 mb-4">
      <!-- Las filas se crearán dinámicamente -->
    </div>

    <!-- Leyenda de colores -->
    <div class="d-flex justify-content-center gap-4 mb-4 flex-wrap">
      <div class="d-flex align-items-center gap-2">
        <div class="btn btn-outline-light btn-sm" style="width:40px; pointer-events:none;">1</div>
        <span class="small">Disponible</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="btn btn-danger btn-sm" style="width:40px; pointer-events:none;">1</div>
        <span class="small">Seleccionada</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="btn btn-secondary btn-sm" style="width:40px; pointer-events:none;" disabled>1</div>
        <span class="small">Ocupada</span>
      </div>
    </div>

    <!-- Resumen de selección -->
    <div class="text-center">
      <p class="mb-1">
        Butacas seleccionadas: <strong id="cantidadSeleccionadas">0</strong>
      </p>
      <p class="fs-4 mb-3">
        Total: <strong class="text-success">$<span id="total">0</span></strong>
      </p>

      <button id="btnContinuar" class="btn btn-danger btn-lg px-5">
        Continuar a la compra
      </button>
    </div>

  </main>

  <script src="js/datos.js"></script>
  <script src="js/butacas.js"></script>

</body>

</html>
