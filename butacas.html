<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Seleccionar Butacas</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">

</head>


<body class="bg-dark text-light">


    <main class="container py-5">


        <!-- Título -->
        <h1 class="fw-bold text-center">

            Selección de Butacas

        </h1>


        <!-- Aquí aparecerá el nombre -->
        <p
            id="tituloSeleccion"
            class="text-center fs-4"
        ></p>


        <!-- Aquí aparecerán fecha, hora y sala -->
        <p
            id="detallesFuncion"
            class="text-center text-secondary"
        ></p>


        <!-- ==================================================
             PANTALLA
             ================================================== -->

        <div class="text-center my-4">

            <div
                class="bg-secondary rounded p-2 mx-auto"
                style="max-width:500px;"
            >

                PANTALLA

            </div>

        </div>


        <!-- ==================================================
             BUTACAS
             ================================================== -->

        <!--
            JavaScript creará los botones
            de las butacas aquí.
        -->

        <div
            id="contenedorButacas"
            class="d-flex flex-wrap justify-content-center gap-2 mx-auto"
            style="max-width:600px;"
        ></div>


        <div class="text-center mt-4">


            <!-- Cantidad -->
            <p>

                Butacas seleccionadas:

                <strong id="cantidadSeleccionadas">

                    0

                </strong>

            </p>


            <!-- Total -->
            <p class="fs-4">

                Total:

                <strong class="text-success">

                    $

                    <span id="total">

                        0

                    </span>

                </strong>

            </p>


            <!-- Continuar -->
            <button
                id="btnContinuar"
                class="btn btn-danger btn-lg"
            >

                Continuar

            </button>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="js/datos.js"></script>

    <script src="js/butacas.js"></script>

</body>

</html>
