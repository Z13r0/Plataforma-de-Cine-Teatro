<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleccionar Butacas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

  <main class="container py-5">

    <h1 class="fw-bold text-center">Selección de Butacas</h1>

    <p id="tituloSeleccion" class="text-center fs-4"></p>

    <p id="detallesFuncion" class="text-center text-secondary"></p>

    <div class="text-center my-4">
      <div class="bg-secondary rounded p-2 mx-auto" style="max-width: 500px;">
        PANTALLA
      </div>
    </div>

    <div id="contenedorButacas" class="d-flex flex-wrap justify-content-center gap-2 mx-auto" style="max-width: 600px;"></div>

    <div class="text-center mt-4">

      <p>
        Butacas seleccionadas: <strong id="cantidadSeleccionadas">0</strong>
      </p>

      <p class="fs-4">
        Total: <strong class="text-success">$<span id="total">0</span></strong>
      </p>

      <button id="btnContinuar" class="btn btn-danger btn-lg">
        Continuar
      </button>

    </div>

  </main>

  <script src="js/datos.js"></script>
  <script src="js/butacas.js"></script>

</body>

</html>
